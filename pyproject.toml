[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finance-workflow-engine"
version = "1.0.0"
description = "Accounts-payable automation: invoice extraction, validation, 3-way matching, bank reconciliation and human-in-the-loop exception handling with a tamper-evident audit trail."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Admire T. Ndaneta" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.7", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/fwe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fwe"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["fwe"]
branch = true

